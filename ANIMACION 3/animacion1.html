<html>
<head>
    <title>ANIMACION 3 VERTICAL CSS</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .btn-volver{
          position: fixed;
          top: 15px;
          left: 15px;
      
          background-color: #0d1b4d;
          color: #1ff5e5;
          border: 1px solid #1ff5e5;
          padding: 8px 15px;
          text-decoration: none;
          font-family: Arial, sans-serif;
          font-size: 16px;
          z-index: 9999;
        }
         .btn-volver:hover{
          transform: scale(1.05);
        }
        .contenedor{
            width: 400px;
            height: 200px;
            border: 1px solid black;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
        }

        .cuadrito{
            width: 100px;
            height: 100px;
            background-color: black;
            position: absolute;
            top: -100px;
            left: 150px;
            animation: cuadrito 3s infinite linear;
        }

        @keyframes cuadrito{
            from{
                top: -100px;
            }
            to{
                top: 200px;
            }
        }
       
    </style>
</head>
<body>
    <a href="index.html" class="btn-volver">Volver</a>
    <div class="contenedor">
        <div class="cuadrito"></div>
    </div>
</body>
</html>
