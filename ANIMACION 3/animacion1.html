<html>
<head>
    <title>ANIMACION 3 VERTICAL CSS</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
         body {
            padding-top: 100px; 
            background-color: #ffffff;
        }
        .btn-volver {
            position: fixed !important;   
            top: 25px !important;         
            left: 25px !important;        
            color: #ffffff !important;   
            text-decoration: none !important;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            background-color: #333333;    
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #555555;
            z-index: 99999 !important;    
            transition: all 0.2s ease;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* EFECTO HOVER DEL BOTÓN VOLVER */
        .btn-volver:hover {
            background-color: #444444;
            border-color: #777777;
            transform: scale(1.05);
        }

        .contenedor{
            width: 400px;
            height: 200px;
            border: 1px solid black;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
        }

        .cuadrito{
            width: 100px;
            height: 100px;
            background-color: black;
            position: absolute;
            top: -100px;
            left: 150px;
            animation: cuadrito 3s infinite linear;
        }

        @keyframes cuadrito{
            from{
                top: -100px;
            }
            to{
                top: 200px;
            }
        }
       
    </style>
</head>
<body>
     <a href="index.html" class="btn-volver">Volver</a>
    <div class="contenedor">
        <div class="cuadrito"></div>
    </div>
</body>
</html>
