<html>
<head>
    <title>ANIMACION 3 HORIZONTAL MEGAMANX CSS</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
        }
        .contenedor{
            width: 400px;
            height: 200px;
            border: 1px solid black;
            position: relative;/*para centrar el div*/
            margin: 0 auto;/*para centrar el div*/
            overflow:hidden;/*muestra solo lo interior*/
            background-color: black;
        }
        .btn-volver{
          position: fixed;
          top: 15px;
          left: 15px;
      
          background-color: #0d1b4d;
          color: #1ff5e5;
          border: 1px solid #1ff5e5;
          padding: 8px 15px;
          text-decoration: none;
          font-family: Arial, sans-serif;
          font-size: 16px;
          z-index: 9999;
        }
         .btn-volver:hover{
          transform: scale(1.05);
        }

        .cuadrito{
            width: 100px;
            height: 100px;
            background-color: black;
            position:absolute;/*permite mover el div*/
            left: -100px;
            top: 50px;

            animation: cuadrito 3s infinite linear;
        }
        
        @keyframes cuadrito{
            from{
                left: -100px;

            }
            to{

                left:500px;
            }
        }
        .cuadrito img{
            width: 100px;
            height: 100px;
        }


    </style>
</head>
<body>
     <a href="index.html" class="btn-volver">Volver</a>
    <div class="contenedor">

        <div class="cuadrito">

            <img src="img/megamanx.gif" alt="">

        </div>

    </div>
      
</body>
</html>
