<html>
    <head>
        <title>VISITA PERÚ</title>
        <style>
            *{
                margin:0px;
                padding:0px;
            }
             body {
                font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                background-color: #f8f9fa;
                color: #333333;
                padding: 40px;
                padding-top: 100px; 
                max-width: 600px;
                margin: 0 auto;
            }
             .btn-volver {
                  position: fixed !important;   
                  top: 25px !important;         
                  left: 25px !important;       
                  color: #ffffff !important;   
                  text-decoration: none !important;
                  font-size: 16px;
                  background-color: #333333;    
                  padding: 10px 20px;
                  border-radius: 8px;
                  border: 1px solid #555555;
                  z-index: 99999 !important;    
                  transition: all 0.2s ease;
                  box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
                }

        /* EFECTO HOVER DEL BOTÓN VOLVER */
        .btn-volver:hover {
            background-color: #444444;
            border-color: #777777;
            transform: scale(1.05);
        }
            .contenedor{
                width: 800px;
                height: 300px;
                position: relative;
                margin: 0 auto;
                border: 1px solid black;
                overflow: hidden;
            }
            .marco1{
                width: 200px;
                height: 300px;
                background-color: red;
                position: absolute;
                top: 0px;
                left: 0px;

                animation: marco1  2s infinite forwards;
                background-image: url(img/mar.jpg);
                background-size: cover;
            }
            @keyframes marco1{
                0%{
                    top:-300px;
                    left: 0px;
                    transform:rotateY(180deg);
                }
                50%{
                    top:300px;
                    left:0px;
                }
                100%{
                    top:0px;
                    left:0px;
                }
            }
            .marco2{
                width: 200px;
                height: 300px;
                background-color: green;
                position: absolute;
                top: 0px;
                left: 200px;

                animation: marco2  2s  infinite  forwards 2s;
                background-image: url(img/costa.jpg);
                background-size: cover;
            }
             @keyframes marco2{
                0%{
                    top:-300px;
                    left:200px;
                    transform:rotateY(180deg);
                }
                50%{
                    top:300px;
                    left:200px;
                }
                100%{
                    top:0px;
                    left:200px;
                }
            }
            .marco3{
                width: 200px;
                height: 300px;
                background-color: yellowgreen;
                position: absolute;
                top: 0px;
                left: 400px;

                animation: marco3  2s infinite forwards;
                background-image: url(img/sierra.jpg);
                background-size: cover;
            }
             @keyframes marco3{
                0%{
                    top:-300px;
                    left:400px;
                    transform:rotateY(180deg);
                }
                50%{
                    top:300px;
                    left:400px;
                }
                100%{
                    top:0px;
                    left:400px;
                }
            }
            .marco4{
                width: 200px;
                height: 300px;
                background-color: blue;
                position: absolute;
                top: 0px;
                left: 600px;

                animation: marco4  2s infinite forwards;
                background-image: url(img/selva.jpg);
                background-size: cover;
            }
             @keyframes marco4{
                0%{
                    top:-300px;
                    left:600px;
                    transform:rotateY(180deg);
                }
                50%{
                    top:300px;
                    left:600px;
                }
                100%{
                    top:0px;
                    left:600px;
                }
            }
            .titulo{
              width: 800px;
              height: 100px;
              background-color: rgba(255, 255, 255, 0.274);
              color: white;
              position: absolute;
              z-index: 2;
              text-align: center;
              font-family: 'impact';
              font-size: 50px;
              padding-top: 30px;
              top:145px;
              animation: titulo 1s 1 forwards;
            }
        </style>
    </head>
    <body>
         <a href="../index.html" class="btn-volver">Volver</a>
        <div class="contenedor">
            <div class="marco1"></div>
            <div class="marco2"></div>
            <div class="marco3"></div>
            <div class="marco4"></div>
            <div class="titulo">LUGARES TURÍSTICOS </div>

        </div>
    </body>
</html>
