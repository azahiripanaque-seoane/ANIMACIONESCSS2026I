<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Publicidad Coco Vainilla</title>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
/* CONTENEDOR */
.contenedor{
    width:300px;
    height:600px;
    background:rgb(226, 193, 6);
    position:relative;
    overflow:hidden;
    border-radius:15px;
    box-shadow:0px 10px 30px rgba(0,0,0,0.5);
}
/* RAMA */
.rama{
    width:400px;
    height:500px;
    background-image:url(img/rama.png);
    background-size:cover;
    background-repeat:no-repeat;
    position:absolute;
    left:80px;
    top:-160px;
    z-index:2;
    transform-origin:top right;
    animation:rama 5s infinite ease-in-out;
}
/* COCOS */
.trozo{
    position:absolute;
    background-size:cover;
    background-repeat:no-repeat;
    opacity:0;
    filter:drop-shadow(0px 10px 10px rgba(0,0,0,0.3));
}
.c1{
    width:100px;
    height:100px;
    background-image:url(img/coco3.png);
    top:5%;
    left:10%;
    animation:caer 6s infinite;
}
.c2{
    width:80px;
    height:80px;
    background-image:url(img/coco2.png);
    top:25%;
    right:10%;
    animation:caer 6s infinite 0.2s;
}
.c3{
    width:90px;
    height:90px;
    background-image:url(img/coco3.png);
    top:60%;
    left:-10px;
    animation:caer 6s infinite 0.4s;
}
/* ESCENA 1 */
.escena1{
    position:absolute;
    width:100%;
    top:50%;
    transform:translateY(-50%);
    z-index:10;
    animation:escena1 6s infinite;
}
/* YA PROBASTE */
.texto{
    color:brown;
    font-size:25px;
    font-family:'Anton', sans-serif;
    width:260px;
    text-align:left;
    padding-left:15px;
}
/* EL NUEVO */
.textoGrande{
    color:white;
    font-size:42px;
    font-family:'Anton', sans-serif;
    font-weight:bold;
    letter-spacing:2px;
    line-height:0.9;
    width:260px;
    text-align:left;
    padding-left:15px;
}
/* SABOR */
.textoGrande2{
    color:white;
    font-size:40px;
    font-family:'Anton', sans-serif;
    font-weight:bold;
    letter-spacing:2px;
    line-height:0.9;
    width:260px;
    text-align:left;
    padding-left:15px;
}
/* ESCENA FINAL */
.escenaFinal{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:11;
}
/* TEXTO FINAL */
.grupoTexto{
    position:absolute;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:slideFinal 6s infinite;
    z-index:13;
}
.cocoTexto{
    color:white;
    font-size:55px;
    font-family:'Anton', sans-serif;
    animation:moverCoco 6s infinite;
}
.vainillaTexto{
    color:white;
    font-size:55px;
    font-family:'Anton', sans-serif;
    animation:moverVainilla 6s infinite;
}
.mas{
    color:brown;
    font-size:70px;
    font-family:'Anton', sans-serif;
    animation:ocultarMas 6s infinite;
}
/* COCO CENTRAL */
.cocoCentral{

    width:230px;
    height:230px;
    background-image:url(img/coco.png);
    background-size:cover;
    background-repeat:no-repeat;
    position:absolute;
    opacity:0;
    z-index:12;
    filter:drop-shadow(0px 15px 15px rgba(0,0,0,0.4));
    animation:popCoco 6s infinite;
}
/* ANIMACIONES */

/* RAMA */

@keyframes rama{
    0%{
        transform:rotate(10deg) translateY(0px);
    }
    50%{
        transform:rotate(20deg) translateY(10px);
    }
    100%{
        transform:rotate(10deg) translateY(0px);
    }
}
/* COCOS */
@keyframes caer{
    0%{
        transform:translateY(-300px) rotate(0deg);
        opacity:0;
    }
    10%{
        opacity:1;
    }
    40%{
        transform:translateY(40px) rotate(20deg);
        opacity:1;
    }
    60%{
        transform:translateY(250px) rotate(40deg);
        opacity:1;
    }
    100%{
        transform:translateY(700px) rotate(70deg);
        opacity:0;
    }
}
/* ESCENA 1 */
@keyframes escena1{

    0%{
        opacity:0;
        transform:translateX(-300px) translateY(-50%);
    }
    10%{
        opacity:1;
        transform:translateX(0px) translateY(-50%);
    }
    40%{
        opacity:1;
        transform:translateX(0px) translateY(-50%);
    }
    50%{
        opacity:0;
        transform:translateX(300px) translateY(-50%);
    }
    100%{
        opacity:0;
    }

}
/* TEXTO FINAL */
@keyframes slideFinal{
    0%,45%{
        opacity:0;
        transform:translateX(300px);
    }
    55%,100%{
        opacity:1;
        transform:translateX(0px);
    }
}
/* MOVIMIENTO COCO */

@keyframes moverCoco{

    0%,68%{
        transform:translateY(0px);
    }
    75%,100%{
        transform:translateY(-120px);
    }
}

/* MOVIMIENTO VAINILLA */

@keyframes moverVainilla{

    0%,68%{
        transform:translateY(0px);
    }
    75%,100%{
        transform:translateY(120px);
    }
}

/* DESAPARECER + */

@keyframes ocultarMas{
    0%,66%{
        opacity:1;
        transform:scale(1);
    }
    75%,100%{
        opacity:0;
        transform:scale(0);
    }

}

/* COCO CENTRAL */

@keyframes popCoco{

    0%,70%{
        opacity:0;
        transform:scale(0);
    }
    75%{
        opacity:1;
        transform:scale(1.2);
    }
    100%{
        opacity:1;
        transform:scale(1);
    }
}

</style>
</head>

<body>

<div class="contenedor">

    <!-- RAMA -->
    <div class="rama"></div>

    <!-- COCOS -->
    <div class="trozo c1"></div>
    <div class="trozo c2"></div>
    <div class="trozo c3"></div>

    <!-- ESCENA 1 -->
    <div class="escena1">

        <div class="texto">YA PROBASTE</div>
        <div class="textoGrande">EL NUEVO</div>
        <div class="textoGrande2">SABOR</div>

    </div>
    <!-- ESCENA FINAL -->
    <div class="escenaFinal">
        <div class="grupoTexto">
            <div class="cocoTexto">COCO</div>
            <div class="mas"> + </div>
            <div class="vainillaTexto">VAINILLA</div>
        </div>
        <!-- COCO CENTRAL -->
        <div class="cocoCentral"></div>
    </div>
</div>
</body>
</html>
