<html>
    <head>
     <title>Pagina Web</title>
    </head>
    
    <style>
    .cuadro1, .cuadro2, .cuadro3{
        width:  600px;
        height: 600px;
        position: absolute;
        border: 1px solid black;
    }
    .btn-volver{
     position: fixed;
     top: 15px;
     left: 15px;
 
     background-color: #0d1b4d;
     color: #1ff5e5;
     border: 1px solid #1ff5e5;
     padding: 8px 15px;
     text-decoration: none;
     font-family: Arial, sans-serif;
     font-size: 16px;
     z-index: 9999;
    }
    .btn-volver:hover{
     transform: scale(1.05);
    }
    .cuadro1{
        background-color: green;
        top: 100px;
        left:100px;
        z-index: 5;
    }
    .cuadro2{
        background-color: red;
        top: 200px;
        left: 200px;
        z-index: 0;
    }
    .cuadro3{
        background-color: yellow;
        top: 300px;
        left: 300px;
        z-index: 1;
    }
    </style>
    <body>
        <a href="index.html" class="btn-volver">Volver</a>
        <div class="cuadro1"></div>
        <div class="cuadro2"></div>
        <div class="cuadro3"></div>
    </body>
    
</html>
