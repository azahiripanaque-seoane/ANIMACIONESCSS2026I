<html>
    <head>
     <title>Pagina Web</title>
    </head>
    
    <style>
    .cuadro1, .cuadro2, .cuadro3{
        width:  600px;
        height: 600px;
        position: absolute;
        border: 1px solid black;
    }
    .cuadro1{
        background-color: green;
        top: 100px;
        left:100px;
        z-index: 5;
    }
    .cuadro2{
        background-color: red;
        top: 200px;
        left: 200px;
        z-index: 0;
    }
    .cuadro3{
        background-color: yellow;
        top: 300px;
        left: 300px;
        z-index: 1;
    }
    </style>
    <body>
        <div class="cuadro1"></div>
        <div class="cuadro2"></div>
        <div class="cuadro3"></div>
    </body>
    
</html>
