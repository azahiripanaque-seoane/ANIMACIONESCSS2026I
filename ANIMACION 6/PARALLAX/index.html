<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax</title>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#021014;
    overflow:hidden;
}
.btn-volver{
     position: fixed;
     top: 15px;
     left: 15px;

     background-color: #0d1b4d;
     color: #1ff5e5;
     border: 1px solid #1ff5e5;
     padding: 8px 15px;
     text-decoration: none;
     font-family: Arial, sans-serif;
     font-size: 16px;
     z-index: 9999;
    }
.btn-volver:hover{
    transform: scale(1.05);
}
.contenedor{
    position:relative;
    width:1000px;
    height:630px;
    overflow:hidden;
    border-radius:20px;
    background:#021014;
    animation:
    camara 6s infinite ease-in-out alternate;
}
.escena{
    position:absolute;
    width:120%;
    height:120%;
    top:-10%;
    left:-10%;
    animation:
    entrar-mundo 3.5s ease-out forwards;
}
.capa{
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
}
.fondo{
    z-index:1;
    object-fit:cover;
    width:90%;
    animation:
    mover-fondo 12s infinite ease-in-out alternate;
}
.medio{
    z-index:2;
    object-fit:cover;
    top:-60px;
    width:100%;
    animation:
    mover-medio 10s infinite ease-in-out alternate;
}
.frente{
    z-index:3;
    object-fit:cover;
    opacity:0.9;
    width:80%;
    left:7.5%;
    animation:
    mover-frente 15s infinite ease-in-out alternate;
}
.neblina{
    position:absolute;
    background:rgba(255,255,255,0.10);
    border-radius:50%;
    filter:blur(45px);
    z-index:4;
    opacity:0.7;
}
.n1{
    width:500px;
    height:180px;
    bottom:40px;
    right:-180px;
    animation:
    mover-neblina1 20s infinite linear alternate;
}
.n2{
    width:420px;
    height:140px;
    bottom:120px;
    right:-120px;
    animation:
    mover-neblina2 24s infinite linear alternate;
}
.n3{
    width:300px;
    height:100px;
    bottom:220px;
    right:100px;
    opacity:0.3;
    animation:
    mover-neblina3 28s infinite linear alternate;
}
.luz{
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(0,255,255,0.12);
    border-radius:50%;
    filter:blur(80px);
    top:-120px;
    right:120px;
    z-index:2;
    animation:
    pulso-luz 4s infinite ease-in-out alternate;
}
.cueva{
    position:absolute;
    width:111%;
    height:170%;
    top:0;
    left:0;
    z-index:5;
    object-fit:cover;
    animation:
    desaparecer-cueva 4s ease-out forwards;
}
.particula{
    position:absolute;
    width:6px;
    height:6px;
    background:#8ffcff;
    border-radius:50%;
    opacity:0.7;
    filter:blur(1px);
    z-index:6;
}
.p1{
    top:120px;
    left:200px;
    animation:
    flotar1 8s infinite linear;
}
.p2{
    top:320px;
    left:760px;
    animation:
    flotar2 10s infinite linear;
}
.p3{
    top:180px;
    left:520px;
    animation:
    flotar3 9s infinite linear;
}
.p4{
    top:420px;
    left:340px;
    animation:
    flotar4 11s infinite linear;
}
.vineta{
    position:absolute;
    width:100%;
    height:100%;
    box-shadow:
    inset 0 0 120px rgba(0,0,0,0.8);
    z-index:7;
}
.oscuridad{
    position:absolute;
    width:100%;
    height:100%;
    background:black;
    z-index:8;
    animation:
    abrir-luz 5s forwards;
}
@keyframes entrar-mundo{
    0%{
        transform:scale(0.55);
    }
    100%{
        transform:scale(1.18);
    }
}
@keyframes desaparecer-cueva{
    0%{
        opacity:1;
        transform:scale(1);
    }
    70%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:scale(1.15);
    }
}
@keyframes mover-fondo{
    0%{
        transform:
        scale(1)
        translateX(0px);
    }
    100%{
        transform:
        scale(1.03)
        translateX(-5px);
    }
}
@keyframes mover-medio{
    0%{
        transform:
        translateX(0px);
    }
    100%{
        transform:
        translateX(-8px);
    }
}
@keyframes mover-frente{
    0%{
        transform:
        translateX(0px)
        translateY(0px);
    }

    100%{
        transform:
        translateX(-10px)
        translateY(4px);
    }
}
@keyframes mover-neblina1{
    0%{
        transform:
        translateX(0px);
        opacity:0.3;
    }

    100%{
        transform:
        translateX(-180px);
        opacity:0.7;
    }
}
@keyframes mover-neblina2{

    0%{
        transform:
        translateX(0px)
        translateY(0px);
        opacity:0.2;
    }

    100%{
        transform:
        translateX(-140px)
        translateY(-10px);
        opacity:0.6;
    }
}
@keyframes mover-neblina3{
    0%{
        transform:
        translateX(0px);
        opacity:0.1;
    }
    100%{
        transform:
        translateX(-90px);
        opacity:0.4;
    }
}
@keyframes pulso-luz{
    0%{
        transform:scale(1);
        opacity:0.3;
    }
    100%{
        transform:scale(1.15);
        opacity:0.7;
    }
}
@keyframes flotar1{
    0%{
        transform:
        translate(0px,0px);
    }
    25%{
        transform:
        translate(15px,-20px);
    }
    50%{
        transform:
        translate(-10px,-40px);
    }
    100%{
        transform:
        translate(20px,-70px);
    }
}
@keyframes flotar2{
    0%{
        transform:
        translate(0px,0px);
    }
    50%{
        transform:
        translate(-20px,-40px);
    }
    100%{
        transform:
        translate(15px,-80px);
    }
}

@keyframes flotar3{
    0%{
        transform:
        translate(0px,0px);
    }
    50%{
        transform:
        translate(10px,-30px);
    }
    100%{
        transform:
        translate(-10px,-70px);
    }
}
@keyframes flotar4{
    0%{
        transform:
        translate(0px,0px);
    }
    50%{
        transform:
        translate(-15px,-40px);
    }
    100%{
        transform:
        translate(20px,-90px);
    }
}

@keyframes abrir-luz{
    0%{
        opacity:1;
    }
    100%{
        opacity:0;
    }
}
@keyframes camara{
    0%{
        transform:
        translateY(0px);
    }
    100%{
        transform:
        translateY(-6px);
    }
}
</style>
</head>
<body>
     <a href="../index.html" class="btn-volver">Volver</a>
<div class="contenedor">
    <div class="escena">
        <div class="luz"></div>
        <img src="img/fondo.png" class="capa fondo">
        <img src="img/medio.png" class="capa medio">
        <img src="img/frente.png" class="capa frente">
        <div class="neblina n1"></div>
        <div class="neblina n2"></div>
        <div class="neblina n3"></div>
        <div class="particula p1"></div>
        <div class="particula p2"></div>
        <div class="particula p3"></div>
        <div class="particula p4"></div>
    </div>
    <img src="img/cueva.png" class="cueva">
    <div class="vineta"></div>
    <div class="oscuridad"></div>
</div>
</body>
</html>
